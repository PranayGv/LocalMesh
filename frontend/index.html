<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalMesh — Return Routing</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/vendor/chart.umd.js"></script>
</head>
<body>
  <main class="page">
    <header>
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </div>
      <div>
        <h1>LocalMesh</h1>
        <p class="subtitle">Smart routing for returned products — local warehouse or central hub?</p>
      </div>
    </header>

    <form id="review-form" class="card">
      <label class="field-label" for="category">Product</label>
      <div class="select-wrap"><select id="category" required></select></div>

      <label class="field-label" for="area">Return area</label>
      <div class="select-wrap"><select id="area" required></select></div>

      <label class="field-label" for="review_text">Return review</label>
      <textarea id="review_text" rows="4" required
        placeholder="e.g. The cooler works fine but it's too noisy for my bedroom."></textarea>

      <button type="submit" id="submit-btn">Process Return</button>
      <p id="form-error" class="error" hidden></p>
    </form>

    <section id="results" hidden></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>

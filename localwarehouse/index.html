<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WareHub | Local Warehouse Administration</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('warehub_theme')||'light'</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd">
  <b>WareHub</b>
  <span id="whName">Chennai Local Warehouse Administration</span>
  <button class="theme" id="themeBtn">Dark mode</button>
  <button class="adm" id="admBtn" aria-haspopup="dialog">Admin: <b id="admName">Karthik</b></button>
  <a href="../seasonmart-shop/index.html">Open SeasonMart store</a>
</header>
<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-t="queue" class="on">Returns queue</button>
  <button data-t="inv">Inventory</button>
  <button data-t="rep">Repairs</button>
  <button data-t="tr">Transfers</button>
  <button data-t="set">Settings</button>
</nav>
<section class="kp" id="kp"></section>
<main id="view"></main>

<dialog id="ovDlg">
  <form id="ovForm">
    <h3 id="ovTitle">Override destination</h3>
    <label><input type="radio" name="d" value="repair"> Local repair</label>
    <label><input type="radio" name="d" value="local" checked> Local warehouse</label>
    <label><input type="radio" name="d" value="far"> Far warehouse</label>
    <div class="dact"><button type="button" class="btn" id="ovCancel">Cancel</button><button type="submit" class="btn p1">Apply</button></div>
  </form>
</dialog>

<dialog id="admDlg">
  <form id="admForm">
    <div class="dh"><h3>Admin profile</h3><button type="button" class="x" data-close aria-label="Close">×</button></div>
    <div class="who"><span class="av" id="admAv">K</span><div><b id="admTitle"></b><small id="admSub"></small></div></div>
    <label>Name<input id="aName" required></label>
    <label>Role<select id="aRole"><option>Warehouse manager</option><option>Supervisor</option><option>Inventory staff</option></select></label>
    <label>Warehouse<input id="aWh"></label>
    <label>Shift<select id="aShift"><option>Morning (6 am to 2 pm)</option><option>Evening (2 pm to 10 pm)</option><option>Night (10 pm to 6 am)</option></select></label>
    <div class="dact"><button type="submit" class="btn p1">Save profile</button></div>
    <h4>Today's activity</h4>
    <div class="stats" id="aStats"></div>
    <ul class="log" id="aLog"></ul>
    <div class="dact"><button type="button" class="btn" id="aCsv">Download returns report (CSV)</button><button type="button" class="btn" id="aClr">Clear activity log</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>

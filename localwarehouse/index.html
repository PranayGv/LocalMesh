<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WareHub | Local Warehouse</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('warehub_theme')||'light'</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hd">
  <b>WareHub</b>
  <label class="loc-picker">
    <span>Active warehouse</span>
    <select id="whSel"></select>
  </label>
  <button class="theme" id="themeBtn">Dark mode</button>
</header>
<section class="kp" id="kp"></section>
<nav class="viewtabs" id="viewTabs">
  <button data-v="act" class="on">Activity</button>
  <button data-v="inv">Inventory</button>
</nav>
<main class="layout" id="actView">
  <aside class="queue-pane">
    <div class="pane-head">
      <h2 id="actTitle">Activity in this warehouse</h2>
      <span class="pane-hint" id="actHint">Returns, repairs and central hub transfers</span>
    </div>
    <div class="queue-list" id="actList"></div>
  </aside>
  <section class="detail-pane" id="detail"></section>
</main>
<main class="inv-wrap" id="invView" hidden>
  <section class="panel">
    <h4 class="panel-title" id="invTitle">Inventory</h4>
    <div class="flt">
      <input type="search" id="invQ" placeholder="Search product, SKU or category">
      <select id="invS" aria-label="Filter by season">
        <option value="all">All seasons</option>
        <option value="summer">Summer</option>
        <option value="monsoon">Monsoon</option>
        <option value="winter">Winter</option>
      </select>
      <label><input type="checkbox" id="invLow"> Low stock only</label>
    </div>
    <div class="sc tall"><table>
      <thead><tr><th>SKU</th><th>Product</th><th>Origin</th><th>Season</th><th>Category</th><th>Price</th><th>In stock</th><th>Status</th></tr></thead>
      <tbody id="invBody"></tbody>
    </table></div>
  </section>
</main>

<dialog id="ovDlg">
  <form id="ovForm">
    <h3 id="ovTitle">Override destination</h3>
    <label><input type="radio" name="d" value="repair"> Local repair</label>
    <label><input type="radio" name="d" value="local" checked> Local warehouse</label>
    <label><input type="radio" name="d" value="far"> Far warehouse</label>
    <div class="dact"><button type="button" class="btn" id="ovCancel">Cancel</button><button type="submit" class="btn p1">Apply</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
